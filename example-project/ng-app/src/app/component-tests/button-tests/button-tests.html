<div>
  <my-button (click)="handleClick()" href="https://google.com">Why is the default button behaviour to navigate?</my-button>
</div>
<div>
  <!--
    These bindings are a build-time test of the `booleanAttributes` output target option, not a
    display case. This app runs with `strictTemplates`, and the library is generated with
    `inlineProperties`, so Angular type-checks every binding below against the declared prop type.

    A bare attribute resolves to the empty string. Without the input transform that the option
    declares, `disabled` and `strong` accept only `boolean`, and `ng build` fails with
    "TS2322: Type 'string' is not assignable to type 'boolean'". Building this app is therefore
    what proves the option works. Don't remove these bindings.
  -->
  <my-button disabled strong>Attribute presence</my-button>
  <my-button disabled="false">Attribute with a value</my-button>
  <my-button [disabled]="isDisabled">Property binding</my-button>
  <my-button [disabled]="maybeDisabled">Nullable property binding</my-button>
</div>
